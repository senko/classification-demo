# Jev through the TypeSafe API (EXPERIMENT.md 6.3).
# The criteria are the category descriptions from data/categories.csv, unchanged.
# Tuning budget: at most 5 prompt variants, each run on the 500 tune items.

# jev-latest resolved to jev-1.14.0 in the smoke test (2026-10-26); pinned.
model = "jev-1.14.0"
# The frozen prompt variant for the run on the evaluation items. Frozen 2026-10-26: v2 for all methods.
main = "v2"

[prompts.v1]
instructions = "Which store category does this product belong to?"
# "string": {id: description}; "object": {id: {"covers": description}}
criteria = "string"

# v2: context about the input. Same text for Jev, Luna and the LLMs.
[prompts.v2]
instructions = """\
The product is from a Croatian retail store. The name is in Croatian, as the store lists it, \
and can contain the brand. Which store category does this product belong to?"""
criteria = "string"

# v3: v2 + decide by what the product is. Same text for Jev, Luna and the LLMs.
[prompts.v3]
instructions = """\
The product is from a Croatian retail store. The name is in Croatian, as the store lists it, \
and can contain the brand. Which store category does this product belong to? Decide by what \
the product is. A word for a flavour, scent or ingredient in the name does not decide the \
category."""
criteria = "string"
